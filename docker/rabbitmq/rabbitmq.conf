# RabbitMQ for local TR-369 (USP) testing.
# STOMP (USP MTP used by the controller): 61613
# MQTT (only if the router has no STOMP MTP): 1883
# Management UI: http://localhost:15672
load_definitions = /etc/rabbitmq/definitions.json

stomp.listeners.tcp.1 = 61613
stomp.default_vhost = /
mqtt.listeners.tcp.default = 1883
mqtt.vhost = /
mqtt.exchange = amq.topic
mqtt.allow_anonymous = false

# Test setup only: no TLS. For production use stomp.listeners.ssl / TLS certificates.
loopback_users = none
