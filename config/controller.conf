# USP Controller configuration (key = value). USP_* environment variables and
# --set key=value on the command line override these values.

# --- RabbitMQ STOMP connection ---
stomp.host = localhost
stomp.port = 61613
stomp.vhost = /
stomp.username = usp-controller
stomp.password = controller-secret
stomp.heartbeat_ms = 10000
stomp.tls = false
# stomp.tls_ca_file = /etc/usp/ca.pem
# stomp.tls_cert_file = /etc/usp/controller.pem
# stomp.tls_key_file = /etc/usp/controller.key

# --- Controller identity ---
# Must equal Device.LocalAgent.Controller.{i}.EndpointID configured on the router.
controller.endpoint_id = proto::usp-controller
# Must equal Device.LocalAgent.Controller.{i}.MTP.{j}.STOMP.Destination on the router.
controller.destination = /queue/usp.controller
# JSON task API (empty value disables it)
controller.task_destination = /queue/usp.controller.tasks
controller.result_destination = /queue/usp.controller.results
controller.usp_version = 1.3
controller.request_timeout_ms = 30000
# Get these paths when an agent connects / boots (comma separated, empty = nothing)
controller.on_boot_get = Device.DeviceInfo.

# Optional: known agent destinations, in case the agent sends no reply-to-dest header.
# agent."os::XXXXXX-SERIAL" = /queue/usp.agent.ex520

log.level = info
